name: Preview smoke

# Runs the Playwright smoke suite against each successful Vercel preview.
# Previews are behind Vercel Deployment Protection; the suite gets through with
# the "GitHub Actions CI" Protection Bypass for Automation secret.
on:
  deployment_status:

permissions:
  contents: read

concurrency:
  group: preview-smoke-${{ github.event.deployment.sha }}
  cancel-in-progress: true

jobs:
  smoke:
    name: smoke (chromium, Vercel preview)
    if: github.event.deployment_status.state == 'success' && github.event.deployment.environment == 'Preview'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.deployment.sha }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.5

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Chromium
        run: bunx playwright install --with-deps chromium

      - name: Run smoke tests against the preview
        env:
          PLAYWRIGHT_BASE_URL: ${{ github.event.deployment_status.environment_url }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: bunx playwright test tests/e2e/smoke.spec.ts --project=chromium

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
